name: EAS Build

# GitHub の Actions タブ →「EAS Build」→「Run workflow」で手動実行する。
# 事前にリポジトリの Secrets に EXPO_TOKEN を登録しておくこと。
# 自動申請には App Store Connect の API キーを EAS に登録しておく必要がある。
on:
  workflow_dispatch:
    inputs:
      platform:
        description: ビルドするプラットフォーム
        type: choice
        options: [ios, android, all]
        default: ios
      profile:
        description: eas.json のビルドプロファイル
        type: choice
        options: [production, preview, development]
        default: production
      auto_submit:
        description: ビルド後にストアへ自動申請する（production のみ）
        type: boolean
        default: true

concurrency:
  group: eas-build-${{ inputs.platform }}-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: EXPO_TOKEN の確認
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::リポジトリの Secrets に EXPO_TOKEN を登録してください"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: ビルド開始
        env:
          PLATFORM: ${{ inputs.platform }}
          PROFILE: ${{ inputs.profile }}
          AUTO_SUBMIT: ${{ inputs.auto_submit && inputs.profile == 'production' }}
        run: |
          args=(--platform "$PLATFORM" --profile "$PROFILE" --non-interactive --no-wait)
          if [ "$AUTO_SUBMIT" = "true" ]; then
            args+=(--auto-submit)
          fi
          eas build "${args[@]}"
